# System packages (.deb, .rpm, Arch) for Cursed Pl@tformer, built by nfpm
# from the same Linux build as the av archive (glibc, so no Alpine .apk).
# The release workflow sets VERSION, RELEASE (our packaging release) and
# ARCH (amd64 or arm64).
#
# The game and its data go to /usr/lib/cursed-platformer; the start script
# in /usr/bin runs it from there.
# No .desktop file on purpose: av is the one place titles are started from,
# so Asciiverse packages never add menu entries.
name: cursed-platformer
arch: ${ARCH}
platform: linux
version: ${VERSION}
release: ${RELEASE}
section: games
priority: optional
maintainer: Asciiverse <packages@asciiverse.sh>
vendor: Asciiverse
homepage: https://github.com/theasciiverse/cursed-platformer
license: GPL-3.0-only AND CC-BY-3.0 AND CC0-1.0
description: |
  A platformer in the terminal: rescue the princess from Tutankhascii.
  You are the @, deep in the pharaoh's underground pyramid: jump, ride
  platforms, dodge munchers and bats, and find the way down.
  Cursed Pl@tformer 1.5 by Samsai, Tuubi and ysblokje, packaged by
  Asciiverse.
contents:
  - src: stage/cursed-platformer
    dst: /usr/bin/cursed-platformer
    file_info: { mode: 0755 }
  - src: stage/lib/cursed-platformer
    dst: /usr/lib/cursed-platformer/cursed-platformer
    file_info: { mode: 0755 }
  - src: stage/lib/data
    dst: /usr/lib/cursed-platformer/data
    type: tree
  - src: LICENSE
    dst: /usr/share/doc/cursed-platformer/copyright
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/cursed-platformer/README.md
    file_info: { mode: 0644 }
  - src: PATCHES.md
    dst: /usr/share/doc/cursed-platformer/PATCHES.md
    file_info: { mode: 0644 }
